# NÃO versionar com valores reais. Usar:
# kubectl create secret generic reviewsapi-secret \
#   --from-literal=MongoDB__ConnectionString="mongodb+srv://..." \
#   --from-literal=Jwt__SecretKey="sua-chave-jwt" \
#   -n fcg-reviews
apiVersion: v1
kind: Secret
metadata:
  name: reviewsapi-secret
  namespace: fcg-reviews
type: Opaque
data:
  MongoDB__ConnectionString: <base64>
  Jwt__SecretKey: <base64>
